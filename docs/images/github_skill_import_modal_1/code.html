<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GitHub Skill Import Modal - Loading State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#2b6cee",
                        "background-light": "#f6f6f8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    animation: {
                        'shimmer': 'shimmer 2s infinite linear',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(100%)' },
                        }
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            font-family: 'Inter', sans-serif;
            min-height: max(884px, 100dvh);
        }
        .shimmer-bg {
            position: relative;
            overflow: hidden;
        }
        .shimmer-bg::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            animation: shimmer 1.5s infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light font-display text-slate-900 min-h-screen flex items-center justify-center p-4">
<div class="fixed inset-0 bg-slate-900/40 backdrop-blur-[2px] z-0"></div>
<div class="relative z-10 w-full max-w-[380px] bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
<div class="px-6 pt-8 pb-4">
<h1 class="text-xl font-semibold text-slate-900 flex items-center gap-2">
<span class="material-icons text-primary text-2xl">account_tree</span>
                Import from GitHub
            </h1>
<p class="text-sm text-slate-500 mt-1">
                Connect your repository to extract skills.
            </p>
</div>
<div class="px-6 py-4">
<label class="block text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-2 ml-1">Repository URL</label>
<div class="flex flex-col gap-3">
<div class="relative w-full">
<input class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 text-sm outline-none transition-all text-slate-400 pointer-events-none" placeholder="https://github.com/user/repo" readonly="" type="text" value="https://github.com/monokoo/skills-collection"/>
</div>
<button class="w-full flex items-center justify-center gap-2 bg-primary/80 cursor-wait text-white px-4 py-3 rounded-xl text-sm font-semibold shadow-sm transition-all" disabled="">
<span class="animate-spin material-icons text-base">sync</span>
                    Analyzing...
                </button>
</div>
</div>
<div class="px-6 py-2">
<div class="flex items-center justify-between mb-4">
<h3 class="text-[10px] font-bold uppercase tracking-widest text-slate-400 ml-1">Discovered Skills</h3>
<span class="text-[9px] bg-primary/10 text-primary px-2.5 py-1 rounded-full font-bold animate-pulse">SEARCHING...</span>
</div>
<div class="space-y-3 max-h-[280px] overflow-hidden">
<div class="flex items-start gap-4 p-4 bg-slate-50 border border-slate-100 rounded-2xl relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/60 to-transparent -translate-x-full animate-[shimmer_2s_infinite] w-full h-full transform skew-x-12"></div>
<div class="mt-0.5">
<div class="w-6 h-6 rounded-lg bg-slate-200 animate-pulse"></div>
</div>
<div class="flex-1 space-y-2.5">
<div class="flex items-center justify-between">
<div class="h-4 w-32 bg-slate-200 rounded-md animate-pulse"></div>
<div class="h-3 w-16 bg-slate-100 rounded-md animate-pulse"></div>
</div>
<div class="h-3 w-24 bg-slate-200/60 rounded-md animate-pulse"></div>
</div>
</div>
<div class="flex items-start gap-4 p-4 bg-slate-50 border border-slate-100 rounded-2xl relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/60 to-transparent -translate-x-full animate-[shimmer_2s_infinite_0.3s] w-full h-full transform skew-x-12"></div>
<div class="mt-0.5">
<div class="w-6 h-6 rounded-lg bg-slate-200 animate-pulse"></div>
</div>
<div class="flex-1 space-y-2.5">
<div class="flex items-center justify-between">
<div class="h-4 w-28 bg-slate-200 rounded-md animate-pulse"></div>
<div class="h-3 w-20 bg-slate-100 rounded-md animate-pulse"></div>
</div>
<div class="h-3 w-40 bg-slate-200/60 rounded-md animate-pulse"></div>
</div>
</div>
<div class="flex items-start gap-4 p-4 bg-slate-50 border border-slate-100 rounded-2xl relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/60 to-transparent -translate-x-full animate-[shimmer_2s_infinite_0.6s] w-full h-full transform skew-x-12"></div>
<div class="mt-0.5">
<div class="w-6 h-6 rounded-lg bg-slate-200 animate-pulse"></div>
</div>
<div class="flex-1 space-y-2.5">
<div class="flex items-center justify-between">
<div class="h-4 w-36 bg-slate-200 rounded-md animate-pulse"></div>
<div class="h-3 w-12 bg-slate-100 rounded-md animate-pulse"></div>
</div>
<div class="h-3 w-20 bg-slate-200/60 rounded-md animate-pulse"></div>
</div>
</div>
</div>
</div>
<div class="p-6 mt-4 flex items-center gap-3 border-t border-slate-100 bg-slate-50/50">
<button class="flex-1 py-3 text-sm font-semibold text-slate-400 hover:text-slate-600 transition-colors">
                Cancel
            </button>
<button class="flex-[2] bg-slate-200 text-slate-400 cursor-not-allowed py-3 rounded-xl text-sm font-bold transition-all" disabled="">
                Import Selected
            </button>
</div>
<div class="flex justify-center pb-3">
<div class="w-32 h-1.5 bg-slate-200 rounded-full"></div>
</div>
</div>

</body></html>
